<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Thống kê doanh thu – CourseDemy</title>
  <meta name="description" content="Thống kê doanh thu và hiệu quả khóa học của giảng viên trên CourseDemy.">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .period-btns { display:flex; gap:6px; flex-wrap:wrap; }
    .period-btn {
      padding:6px 14px; border-radius:100px; border:1px solid var(--border-light);
      background:transparent; color:var(--text-dim); cursor:pointer; font-size:.82rem;
      font-weight:600; font-family:inherit; transition:all .18s;
    }
    .period-btn:hover { border-color:var(--primary); color:var(--primary); }
    .period-btn.active { background:var(--primary-dark); border-color:var(--primary-dark); color:#fff; }
    .chart-card {
      background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius);
      padding:24px; margin-bottom:28px;
    }
    .chart-card-title {
      font-size:1rem; font-weight:700; margin-bottom:16px;
      display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;
    }
    .chart-wrap { position:relative; height:280px; }
    .stat-detail { font-size:.78rem; color:var(--text-muted); margin-top:4px; }
    .sortable-th { cursor:pointer; user-select:none; }
    .sortable-th:hover { color:var(--primary); }
    .sort-icon { margin-left:4px; opacity:.5; font-size:.8em; }
    .sort-icon.active { opacity:1; color:var(--primary); }
    .thumb-sm {
      width:48px; height:32px; object-fit:cover; border-radius:4px;
      background:var(--bg-2); flex-shrink:0;
    }
    .thumb-ph-sm {
      width:48px; height:32px; border-radius:4px; background:var(--bg-2);
      display:flex; align-items:center; justify-content:center; font-size:1.1rem;
    }
    @media(max-width:600px){
      .chart-wrap { height:200px; }
      .learn-layout { grid-template-columns:1fr; }
    }

    /* ── Student Stats ── */
    .student-filter-bar {
      display:flex; gap:10px; flex-wrap:wrap; align-items:center;
      margin-bottom:16px;
    }
    .student-filter-bar .search-wrap { flex:1; min-width:200px; position:relative; }
    .student-filter-bar .search-icon { position:absolute; left:12px; top:50%; transform:translateY(-50%); font-size:.9rem; }
    .student-filter-bar .search-input { padding-left:38px !important; }
    .stu-avatar {
      width:36px; height:36px; border-radius:50%; flex-shrink:0;
      background:linear-gradient(135deg,var(--primary-dark),#a78bfa);
      display:flex; align-items:center; justify-content:center;
      font-weight:700; font-size:.82rem; color:#fff; overflow:hidden;
    }
    .stu-avatar img { width:100%; height:100%; object-fit:cover; }
    .progress-mini-track {
      flex:1; max-width:120px; height:6px;
      background:var(--border); border-radius:100px; overflow:hidden;
    }
    .progress-mini-fill {
      height:100%;
      background:linear-gradient(90deg,var(--primary-dark),var(--success));
      border-radius:100px;
      transition:width .4s ease;
    }
    .course-thumb-xs {
      width:40px; height:26px; object-fit:cover;
      border-radius:3px; flex-shrink:0; background:var(--bg-2);
    }
  </style>
</head>
<body>
<nav id="navbar"></nav>
<div id="toast-container"></div>
<div id="spinner" class="hidden"><div class="spinner-ring"></div></div>

<main class="container section">
  <div class="section-header" style="margin-bottom:28px">
    <div>
      <h1 class="page-title">📊 Thống kê doanh thu</h1>
      <p class="page-subtitle">Theo dõi hiệu quả giảng dạy và doanh thu của bạn</p>
    </div>
    <a href="/instructor-wallet.html" class="btn btn-primary">💰 Yêu cầu rút tiền</a>
  </div>

  <!-- ── Overview Cards ──────────────────────────────────────── -->
  <div class="stats-grid" id="overview-cards" style="margin-bottom:32px">
    <div class="skeleton-card stat-card"><div class="skeleton skeleton-line medium" style="height:32px"></div><div class="skeleton skeleton-line short thin" style="margin-top:8px"></div></div>
    <div class="skeleton-card stat-card"><div class="skeleton skeleton-line medium" style="height:32px"></div><div class="skeleton skeleton-line short thin" style="margin-top:8px"></div></div>
    <div class="skeleton-card stat-card"><div class="skeleton skeleton-line medium" style="height:32px"></div><div class="skeleton skeleton-line short thin" style="margin-top:8px"></div></div>
    <div class="skeleton-card stat-card"><div class="skeleton skeleton-line medium" style="height:32px"></div><div class="skeleton skeleton-line short thin" style="margin-top:8px"></div></div>
    <div class="skeleton-card stat-card"><div class="skeleton skeleton-line medium" style="height:32px"></div><div class="skeleton skeleton-line short thin" style="margin-top:8px"></div></div>
  </div>

  <!-- ── Revenue Chart ───────────────────────────────────────── -->
  <div class="chart-card">
    <div class="chart-card-title">
      <span>📈 Doanh thu theo thời gian</span>
      <div class="period-btns">
        <button class="period-btn active" id="p-7days" onclick="loadRevenue('7days')">7 ngày</button>
        <button class="period-btn" id="p-30days" onclick="loadRevenue('30days')">30 ngày</button>
        <button class="period-btn" id="p-12months" onclick="loadRevenue('12months')">12 tháng</button>
      </div>
    </div>
    <div class="chart-wrap">
      <canvas id="revenue-chart"></canvas>
    </div>
  </div>

  <!-- ── Course Performance Table ───────────────────────────── -->
  <div class="chart-card">
    <div class="chart-card-title">📚 Hiệu quả từng khóa học</div>
    <div id="courses-table-wrap">
      <div class="empty-state"><div class="spinner-ring"></div></div>
    </div>
  </div>

  <!-- ── Student Statistics ─────────────────────────────────── -->
  <div class="chart-card">
    <div class="chart-card-title">
      <span>👥 Danh sách học viên</span>
      <span id="student-count-label" style="font-size:.82rem;font-weight:400;color:var(--text-muted)"></span>
    </div>

    <div class="student-filter-bar">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" id="stu-search" class="form-control search-input"
          placeholder="Tìm theo tên hoặc email..." oninput="onStudentSearch()">
      </div>
      <select class="form-control" id="stu-course-filter" style="min-width:200px" onchange="loadStudents(1)">
        <option value="">— Tất cả khóa học —</option>
      </select>
      <button class="btn btn-outline btn-sm" onclick="resetStudentFilters()">✕ Xóa lọc</button>
    </div>

    <div id="students-table-wrap">
      <div class="empty-state"><div class="spinner-ring"></div></div>
    </div>
    <div id="students-pagination" style="display:flex;gap:8px;align-items:center;justify-content:center;margin-top:16px"></div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="js/api.js"></script>
<script>
if (!requireAuth('/login.html')) throw 0;
if (!requireRole('instructor', '/index.html')) throw 0;
renderNavbar('instructor-stats');

// ── Helpers ──────────────────────────────────────────────────────────────────
function fmtVND(n) {
  return Number(n || 0).toLocaleString('vi-VN') + '₫';
}
function fmtStar(v) {
  return v ? Number(v).toFixed(1) + ' ★' : '—';
}

// ── Overview Cards ───────────────────────────────────────────────────────────
async function loadOverview() {
  const { ok, data } = await apiFetch('/instructor/stats/overview');
  const el = document.getElementById('overview-cards');
  if (!ok) {
    el.innerHTML = `<p style="color:var(--danger)">${data.message || 'Lỗi tải dữ liệu'}</p>`;
    return;
  }
  const s = data.data;
  el.innerHTML = `
    <div class="stat-card">
      <div class="stat-icon">💰</div>
      <div class="stat-value">${fmtVND(s.total_revenue)}</div>
      <div class="stat-label">Tổng doanh thu</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon">👥</div>
      <div class="stat-value">${s.total_students ?? 0}</div>
      <div class="stat-label">Tổng học viên</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon">📚</div>
      <div class="stat-value">${s.total_courses ?? 0}</div>
      <div class="stat-label">Tổng khóa học</div>
      <div class="stat-detail">
        ✅ ${s.approved_courses ?? 0} đã duyệt
        &nbsp;·&nbsp;
        ⏳ ${s.pending_courses ?? 0} chờ duyệt
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon">⭐</div>
      <div class="stat-value" style="color:var(--warning)">${fmtStar(s.avg_rating)}</div>
      <div class="stat-label">Đánh giá trung bình</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon">🏦</div>
      <div class="stat-value" style="color:var(--success)">${fmtVND(s.current_balance)}</div>
      <div class="stat-label">Số dư ví</div>
    </div>`;
}

// ── Revenue Chart ────────────────────────────────────────────────────────────
let revenueChart = null;
let currentPeriod = '7days';

async function loadRevenue(period = '7days') {
  currentPeriod = period;
  // Update active button
  ['7days','30days','12months'].forEach(p => {
    document.getElementById(`p-${p}`)?.classList.toggle('active', p === period);
  });

  const { ok, data } = await apiFetch(`/instructor/stats/revenue?period=${period}`);
  if (!ok) { showToast('Lỗi tải biểu đồ doanh thu', 'error'); return; }

  // Backend trả về { period, labels: [...], revenue: [...] } — 2 mảng riêng
  const d = data.data || {};
  const labels = d.labels || (d.data || []).map(r => r.label || r.period || r.date || '');
  const values = d.revenue || (d.data || []).map(r => Number(r.revenue ?? r.total ?? 0));

  const ctx = document.getElementById('revenue-chart').getContext('2d');
  if (revenueChart) revenueChart.destroy();
  revenueChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [{
        label: 'Doanh thu (₫)',
        data: values,
        borderColor: '#818cf8',
        backgroundColor: 'rgba(129,140,248,0.12)',
        borderWidth: 2.5,
        pointRadius: 4,
        pointBackgroundColor: '#818cf8',
        fill: true,
        tension: 0.35,
      }],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: ctx => ' ' + Number(ctx.parsed.y).toLocaleString('vi-VN') + '₫',
          },
        },
      },
      scales: {
        x: {
          grid: { color: 'rgba(255,255,255,0.05)' },
          ticks: { color: '#64748b', font: { size: 11 } },
        },
        y: {
          grid: { color: 'rgba(255,255,255,0.05)' },
          ticks: {
            color: '#64748b',
            font: { size: 11 },
            callback: v => Number(v).toLocaleString('vi-VN') + '₫',
          },
          beginAtZero: true,
        },
      },
    },
  });
}

// ── Course Performance Table ─────────────────────────────────────────────────
let coursesData = [];
let sortCol = 'revenue';
let sortDir = -1; // -1 desc, 1 asc

async function loadCoursesTable() {
  const { ok, data } = await apiFetch('/instructor/stats/courses');
  if (!ok) {
    document.getElementById('courses-table-wrap').innerHTML =
      `<p style="color:var(--danger)">${data.message || 'Lỗi tải dữ liệu'}</p>`;
    return;
  }
  coursesData = data.data || [];
  renderCoursesTable();
}

function renderCoursesTable() {
  const sorted = [...coursesData].sort((a, b) => {
    const va = Number(a[sortCol] ?? 0);
    const vb = Number(b[sortCol] ?? 0);
    return (va - vb) * sortDir;
  });

  if (!sorted.length) {
    document.getElementById('courses-table-wrap').innerHTML =
      `<div class="empty-state"><div class="empty-icon">📚</div><p class="empty-text">Chưa có dữ liệu khóa học.</p></div>`;
    return;
  }

  const sortIcon = (col) => {
    if (col !== sortCol) return `<span class="sort-icon">⇅</span>`;
    return `<span class="sort-icon active">${sortDir === -1 ? '↓' : '↑'}</span>`;
  };

  const statusMap = {
    approved: { cls: 'badge-success', label: '✅ Đã duyệt' },
    pending:  { cls: 'badge-warning', label: '⏳ Chờ duyệt' },
    rejected: { cls: 'badge-danger',  label: '❌ Từ chối' },
  };

  document.getElementById('courses-table-wrap').innerHTML = `
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>Khóa học</th>
          <th>Trạng thái</th>
          <th class="sortable-th" onclick="sortTable('students_count')">
            Học viên ${sortIcon('students_count')}
          </th>
          <th class="sortable-th" onclick="sortTable('revenue')">
            Doanh thu ${sortIcon('revenue')}
          </th>
          <th>Đánh giá</th>
        </tr></thead>
        <tbody>
          ${sorted.map(c => {
            const st = statusMap[c.status] || { cls: 'badge-info', label: c.status };
            const thumb = c.thumbnail
              ? `<img src="${c.thumbnail}" class="thumb-sm" alt="">`
              : `<div class="thumb-ph-sm">📚</div>`;
            return `<tr>
              <td>
                <div style="display:flex;align-items:center;gap:10px">
                  ${thumb}
                  <div>
                    <div style="font-weight:600;font-size:.88rem">${c.title}</div>
                    <div style="font-size:.75rem;color:var(--text-muted)">${c.category || ''}</div>
                  </div>
                </div>
              </td>
              <td><span class="badge ${st.cls}">${st.label}</span></td>
              <td style="font-weight:600">${c.students_count ?? c.students ?? 0}</td>
              <td style="font-weight:700;color:var(--primary)">${fmtVND(c.revenue)}</td>
              <td style="color:var(--warning)">${fmtStar(c.avg_rating)}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>`;
}

function sortTable(col) {
  if (sortCol === col) sortDir = -sortDir;
  else { sortCol = col; sortDir = -1; }
  renderCoursesTable();
}

// ── Student Statistics ───────────────────────────────────────────────────────────────────────────
let studentPage = 1;
let studentTotalPages = 1;
let studentSearchTimeout = null;

async function loadCourseFilter() {
  const { ok, data } = await apiFetch('/instructor/courses');
  if (!ok) return;
  const courses = (data.data || []).filter(c => c.status === 'approved');
  const sel = document.getElementById('stu-course-filter');
  courses.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c.id;
    opt.textContent = c.title;
    sel.appendChild(opt);
  });
}

async function loadStudents(page = 1) {
  studentPage = page;
  const search   = document.getElementById('stu-search').value.trim();
  const courseId = document.getElementById('stu-course-filter').value;

  let qs = `?page=${page}&limit=20`;
  if (search)   qs += `&search=${encodeURIComponent(search)}`;
  if (courseId) qs += `&course_id=${courseId}`;

  const wrap = document.getElementById('students-table-wrap');
  wrap.innerHTML = `<div class="empty-state" style="padding:24px 0"><div class="spinner-ring"></div></div>`;
  document.getElementById('students-pagination').innerHTML = '';

  const { ok, data } = await apiFetch(`/instructor/students${qs}`);
  if (!ok) {
    wrap.innerHTML = `<p style="color:var(--danger)">${data.message || 'Lỗi tải dữ liệu'}</p>`;
    return;
  }

  const students  = data.data?.students ?? [];
  const total     = data.data?.total ?? 0;
  studentTotalPages = data.data?.totalPages ?? 1;

  document.getElementById('student-count-label').textContent =
    `${total} lượt đăng ký${search ? ` · tìm kiếm: "${search}"` : ''}`;

  if (!students.length) {
    wrap.innerHTML = `<div class="empty-state" style="padding:32px 0"><div class="empty-icon">👥</div><p class="empty-text">Không có học viên nào phù hợp.</p></div>`;
    return;
  }

  wrap.innerHTML = `
    <div class="table-wrap"><table>
      <thead><tr>
        <th>Học viên</th>
        <th>Email</th>
        <th>Khóa học</th>
        <th>Ngày đăng ký</th>
        <th>Tiến độ</th>
      </tr></thead>
      <tbody>
        ${students.map(s => {
          const initials = (s.full_name || '?').charAt(0).toUpperCase();
          const avatarHtml = s.avatar
            ? `<img src="${escHtml(s.avatar)}" alt="" style="width:36px;height:36px;border-radius:50%;object-fit:cover;flex-shrink:0">`
            : `<div class="stu-avatar">${initials}</div>`;
          const thumbHtml = s.course?.thumbnail
            ? `<img src="${escHtml(s.course.thumbnail)}" class="course-thumb-xs" alt="">`
            : `<div class="course-thumb-xs" style="display:flex;align-items:center;justify-content:center;font-size:.9rem">📚</div>`;
          const pct = Math.round(s.progress_percent ?? 0);
          return `<tr>
            <td>
              <div style="display:flex;align-items:center;gap:10px">
                ${avatarHtml}
                <div style="font-weight:600;font-size:.88rem">${escHtml(s.full_name)}</div>
              </div>
            </td>
            <td style="font-size:.83rem;color:var(--text-dim)">${escHtml(s.email)}</td>
            <td>
              <div style="display:flex;align-items:center;gap:8px">
                ${thumbHtml}
                <span style="font-size:.82rem;font-weight:600;max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${escHtml(s.course?.title || '—')}</span>
              </div>
            </td>
            <td style="font-size:.82rem;color:var(--text-dim)">${formatDate(s.enrolled_at)}</td>
            <td>
              <div style="display:flex;align-items:center;gap:8px">
                <div class="progress-mini-track">
                  <div class="progress-mini-fill" style="width:${pct}%"></div>
                </div>
                <span style="font-size:.78rem;font-weight:700;color:var(--primary);min-width:32px">${pct}%</span>
              </div>
            </td>
          </tr>`;
        }).join('')}
      </tbody>
    </table></div>`;

  renderStudentPagination();
}

function renderStudentPagination() {
  const pag = document.getElementById('students-pagination');
  if (studentTotalPages <= 1) { pag.innerHTML = ''; return; }
  pag.innerHTML = `
    <button class="btn btn-outline btn-sm" onclick="loadStudents(${studentPage-1})" ${studentPage===1?'disabled':''}>← Trước</button>
    <span class="page-info" style="font-size:.8rem">Trang ${studentPage} / ${studentTotalPages}</span>
    <button class="btn btn-outline btn-sm" onclick="loadStudents(${studentPage+1})" ${studentPage===studentTotalPages?'disabled':''}>Sau →</button>`;
}

function onStudentSearch() {
  clearTimeout(studentSearchTimeout);
  studentSearchTimeout = setTimeout(() => loadStudents(1), 400);
}

function resetStudentFilters() {
  document.getElementById('stu-search').value = '';
  document.getElementById('stu-course-filter').value = '';
  loadStudents(1);
}

function escHtml(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Init ────────────────────────────────────────────────────────────────────────────────
(async () => {
  await Promise.all([
    loadOverview(),
    loadRevenue('7days'),
    loadCoursesTable(),
    loadCourseFilter(),
    loadStudents(1),
  ]);
})();
</script>
</body>
</html>
