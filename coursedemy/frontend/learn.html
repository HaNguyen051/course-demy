<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Học bài – CourseDemy</title>
  <meta name="description" content="Xem bài học, quiz và theo dõi tiến độ học tập trên CourseDemy.">
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* ── Learn Page Layout ── */
    .learn-page { display: flex; flex-direction: column; min-height: 100vh; }

    /* Progress bar */
    .learn-progress-bar-wrap {
      background: var(--bg-2);
      border-bottom: 1px solid var(--border);
      padding: 10px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .learn-progress-bar-label { font-size: .82rem; color: var(--text-dim); white-space: nowrap; font-weight: 600; }
    .learn-progress-track {
      flex: 1; height: 8px; background: var(--border);
      border-radius: 100px; overflow: hidden;
    }
    .learn-progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary-dark), var(--success));
      border-radius: 100px;
      transition: width 0.5s ease;
    }
    .learn-progress-pct { font-size: .82rem; font-weight: 700; color: var(--primary); min-width: 38px; text-align: right; }

    /* Not enrolled banner */
    .not-enrolled-banner {
      background: var(--warning-bg);
      border: 1px solid var(--warning);
      border-radius: var(--radius-sm);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: .9rem;
      color: var(--warning);
      margin-bottom: 20px;
    }
    .not-enrolled-banner a { color: var(--warning); text-decoration: underline; }

    /* 2-column learn layout */
    .learn-body {
      display: grid;
      grid-template-columns: 320px 1fr;
      flex: 1;
      min-height: 0;
    }

    /* Sidebar */
    .learn-sidebar {
      background: var(--bg-2);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      max-height: calc(100vh - 130px);
      position: sticky;
      top: 64px;
    }
    .sidebar-header {
      padding: 16px 20px;
      font-size: .82rem;
      font-weight: 700;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: .5px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-2);
      position: sticky;
      top: 0;
      z-index: 5;
    }
    .section-group { border-bottom: 1px solid var(--border); }
    .section-title {
      padding: 12px 20px;
      font-size: .85rem;
      font-weight: 700;
      color: var(--text-dim);
      background: rgba(255,255,255,.02);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      user-select: none;
    }
    .section-title:hover { background: var(--bg-hover); }
    .section-lessons { list-style: none; }
    .lesson-row {
      padding: 10px 20px 10px 28px;
      font-size: .88rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      border-left: 3px solid transparent;
      transition: all var(--transition);
      color: var(--text-dim);
    }
    .lesson-row:hover { background: var(--bg-hover); color: var(--text); }
    .lesson-row.active {
      border-left-color: var(--primary);
      background: var(--primary-glow);
      color: var(--primary);
    }
    .lesson-row.locked { cursor: default; opacity: .55; }
    .lesson-row .lesson-icon { font-size: .9rem; flex-shrink: 0; }
    .lesson-row .lesson-name { flex: 1; line-height: 1.4; }
    .lesson-row .done-check { color: var(--success); font-size: .85rem; flex-shrink: 0; }
    .lesson-row .preview-tag {
      font-size: .68rem; padding: 1px 6px;
      background: var(--info-bg); color: var(--info);
      border-radius: 100px; flex-shrink: 0;
    }

    /* Main content area */
    .learn-main {
      overflow-y: auto;
      max-height: calc(100vh - 130px);
      padding: 24px 32px;
    }

    /* Video area */
    .lesson-video-wrap {
      width: 100%;
      aspect-ratio: 16/9;
      background: #000;
      border-radius: var(--radius);
      overflow: hidden;
      margin-bottom: 20px;
    }
    .lesson-video-wrap iframe,
    .lesson-video-wrap video {
      width: 100%; height: 100%; border: none; display: block;
    }
    .lesson-video-placeholder {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      font-size: 4rem; color: var(--text-muted);
      background: linear-gradient(135deg, var(--bg-card), var(--bg-2));
    }

    /* Lesson content */
    .lesson-header { margin-bottom: 20px; }
    .lesson-header h2 { font-size: 1.3rem; font-weight: 700; margin-bottom: 6px; }
    .lesson-header p { font-size: .88rem; color: var(--text-dim); }
    .lesson-type-badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 3px 10px; border-radius: 100px; font-size: .72rem; font-weight: 600;
      margin-bottom: 10px;
    }
    .type-video { background: var(--primary-glow); color: var(--primary); }
    .type-content { background: var(--info-bg); color: var(--info); }
    .type-quiz { background: var(--warning-bg); color: var(--warning); }

    .content-body {
      line-height: 1.85;
      font-size: .95rem;
      color: var(--text);
    }
    .content-body p { margin-bottom: 12px; }

    /* Complete button area */
    .complete-area {
      display: flex; align-items: center; gap: 12px;
      margin-top: 24px; padding-top: 20px;
      border-top: 1px solid var(--border);
    }
    .completed-badge {
      display: inline-flex; align-items: center; gap: 6px;
      color: var(--success); font-size: .88rem; font-weight: 600;
    }

    /* Quiz */
    .quiz-wrap { display: flex; flex-direction: column; gap: 24px; }
    .quiz-question-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 24px;
    }
    .quiz-question-text { font-weight: 600; margin-bottom: 16px; line-height: 1.6; }
    .quiz-options { display: flex; flex-direction: column; gap: 10px; }
    .quiz-option-label {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all var(--transition);
      font-size: .92rem;
    }
    .quiz-option-label:hover { border-color: var(--primary); background: var(--primary-glow); }
    .quiz-option-label:has(input:checked) { border-color: var(--primary); background: var(--primary-glow); color: var(--primary); }
    .quiz-option-label input { accent-color: var(--primary); flex-shrink: 0; }
    .quiz-option-label.correct { border-color: var(--success) !important; background: var(--success-bg) !important; color: var(--success) !important; }
    .quiz-option-label.wrong { border-color: var(--danger) !important; background: var(--danger-bg) !important; color: var(--danger) !important; }

    .quiz-submit-area { margin-top: 8px; }
    .quiz-result-box {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 24px;
      text-align: center;
      border: 1px solid var(--border);
    }
    .quiz-score { font-size: 2.5rem; font-weight: 800; color: var(--primary); margin-bottom: 8px; }
    .quiz-score-label { font-size: .95rem; color: var(--text-dim); }

    /* Locked lesson */
    .locked-lesson {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 300px; text-align: center; gap: 16px;
      color: var(--text-dim);
    }
    .locked-lesson .lock-icon { font-size: 3.5rem; }
    .locked-lesson h3 { font-size: 1.1rem; font-weight: 700; color: var(--text); }
    .locked-lesson p { font-size: .9rem; max-width: 380px; }

    /* Welcome state */
    .welcome-state {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 350px; text-align: center; gap: 12px; color: var(--text-dim);
    }
    .welcome-state .welcome-icon { font-size: 4rem; }

    /* Cert banner */
    .cert-banner {
      display: flex; align-items: center; gap: 16px;
      background: linear-gradient(135deg, #1a2b1a, #0f2b0f);
      border: 1px solid var(--success);
      border-radius: var(--radius);
      padding: 20px 24px;
      margin-bottom: 20px;
    }
    .cert-banner-icon { font-size: 2.5rem; flex-shrink: 0; }
    .cert-banner-text { flex: 1; }
    .cert-banner-title { font-weight: 700; color: var(--success); font-size: 1rem; }
    .cert-banner-sub { font-size: .85rem; color: var(--text-dim); margin-top: 4px; }

    @media (max-width: 900px) {
      .learn-body { grid-template-columns: 1fr; }
      .learn-sidebar { max-height: 280px; position: static; }
      .learn-main { max-height: none; padding: 16px; }
    }

    /* ── Q&A Styles ── */
    .lesson-tabs {
      display: flex; gap: 4px;
      border-bottom: 2px solid var(--border);
      margin-bottom: 24px;
    }
    .lesson-tab-btn {
      padding: 10px 18px; background: none; border: none;
      border-bottom: 2px solid transparent; margin-bottom: -2px;
      font-size: .88rem; font-weight: 600; color: var(--text-dim);
      cursor: pointer; transition: all .15s; font-family: inherit;
    }
    .lesson-tab-btn:hover { color: var(--text); }
    .lesson-tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }
    .lesson-tab-panel { display: none; }
    .lesson-tab-panel.active { display: block; }

    .qna-section-title {
      font-size: .9rem; font-weight: 700; color: var(--text-dim);
      text-transform: uppercase; letter-spacing: .5px;
      margin-bottom: 16px;
    }
    .qna-ask-form {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 24px;
    }
    .qna-ask-form-title { font-weight: 700; margin-bottom: 14px; font-size: .95rem; }
    .qna-question-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 20px;
      margin-bottom: 12px;
      cursor: pointer;
      transition: border-color .15s, box-shadow .15s;
    }
    .qna-question-card:hover { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-glow); }
    .qna-question-card.resolved { opacity: .72; }
    .qna-q-header { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 8px; }
    .qna-q-avatar {
      width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
      background: linear-gradient(135deg, var(--primary-dark), #a78bfa);
      display: flex; align-items: center; justify-content: center;
      font-size: .8rem; font-weight: 700; color: #fff; overflow: hidden;
    }
    .qna-q-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .qna-q-meta { flex: 1; }
    .qna-q-author { font-weight: 600; font-size: .85rem; }
    .qna-q-time { font-size: .75rem; color: var(--text-muted); margin-top: 2px; }
    .qna-q-title { font-weight: 700; font-size: .95rem; margin-bottom: 4px; }
    .qna-q-preview { font-size: .84rem; color: var(--text-dim); line-height: 1.5;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .qna-q-footer { display: flex; gap: 12px; align-items: center; margin-top: 10px; }
    .badge-resolved { background: var(--success-bg); color: var(--success); border: 1px solid var(--success); }
    .badge-unresolved { background: var(--warning-bg); color: var(--warning); border: 1px solid var(--warning); }

    .qna-detail-modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.75);
      display: flex; align-items: center; justify-content: center;
      z-index: 3000; padding: 24px; backdrop-filter: blur(4px);
    }
    .qna-detail-modal-overlay.hidden { display: none; }
    .qna-detail-box {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 28px 32px;
      width: 100%; max-width: 640px; max-height: 85vh;
      overflow-y: auto; box-shadow: var(--shadow-lg);
    }
    .qna-detail-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; gap: 12px; }
    .qna-detail-title { font-size: 1.05rem; font-weight: 700; line-height: 1.4; flex: 1; }
    .qna-detail-body { font-size: .92rem; color: var(--text-dim); line-height: 1.7; white-space: pre-wrap; margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
    .qna-answers-header { font-weight: 700; font-size: .9rem; margin-bottom: 12px; }
    .qna-answer-card {
      background: var(--bg-2); border-radius: var(--radius-sm);
      padding: 14px 16px; margin-bottom: 10px;
    }
    .qna-answer-card.instructor-answer {
      background: linear-gradient(135deg,rgba(139,92,246,.08),rgba(99,102,241,.08));
      border: 1px solid rgba(139,92,246,.3);
    }
    .qna-answer-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .qna-answer-avatar {
      width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
      background: linear-gradient(135deg, var(--primary-dark), #a78bfa);
      display: flex; align-items: center; justify-content: center;
      font-size: .72rem; font-weight: 700; color: #fff; overflow: hidden;
    }
    .qna-answer-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .qna-answer-meta { flex: 1; }
    .qna-answer-author { font-weight: 600; font-size: .83rem; }
    .qna-answer-time { font-size: .73rem; color: var(--text-muted); }
    .qna-answer-body { font-size: .88rem; line-height: 1.65; color: var(--text); white-space: pre-wrap; }
    .qna-reply-area { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border); }
    .qna-reply-area-title { font-weight: 700; font-size: .88rem; margin-bottom: 10px; }
    .badge-instructor { background: rgba(139,92,246,.15); color: #a78bfa; border: 1px solid rgba(139,92,246,.3); }

    /* ── Video Speed Bar ── */
    .video-speed-bar {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      padding: 10px 16px;
      background: var(--bg-2); border-bottom: 1px solid var(--border);
    }
    .video-speed-label { font-size: .8rem; font-weight: 700; color: var(--text-dim); white-space: nowrap; }
    .speed-btn {
      padding: 4px 12px; border-radius: 100px;
      border: 1px solid var(--border); background: none;
      font-size: .8rem; font-weight: 600; color: var(--text-dim);
      cursor: pointer; transition: all .15s; font-family: inherit;
    }
    .speed-btn:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-glow); }
    .speed-btn.active { border-color: var(--primary); background: var(--primary); color: #fff; }
  </style>
</head>
<body class="learn-page">
<nav id="navbar"></nav>
<div id="toast-container"></div>
<div id="spinner" class="hidden"><div class="spinner-ring"></div></div>

<!-- Progress bar -->
<div class="learn-progress-bar-wrap" id="progress-bar-wrap" style="display:none">
  <span class="learn-progress-bar-label">Tiến độ:</span>
  <div class="learn-progress-track">
    <div class="learn-progress-fill" id="progress-fill" style="width:0%"></div>
  </div>
  <span class="learn-progress-pct" id="progress-pct">0%</span>
</div>

<div class="learn-body">
  <!-- Left: Sidebar -->
  <aside class="learn-sidebar" id="sidebar">
    <div class="sidebar-header">📚 Nội dung khóa học</div>
    <div id="curriculum-list"><div style="padding:24px;text-align:center"><div class="spinner-ring" style="margin:auto"></div></div></div>
  </aside>

  <!-- Right: Content -->
  <main class="learn-main" id="learn-main">
    <div id="not-enrolled-banner" style="display:none" class="not-enrolled-banner">
      ⚠️ Bạn cần mua khóa học này để xem đầy đủ nội dung.
      <a id="not-enrolled-link" href="#">Xem khóa học →</a>
    </div>
    <div id="cert-banner" style="display:none" class="cert-banner">
      <div class="cert-banner-icon">🏆</div>
      <div class="cert-banner-text">
        <div class="cert-banner-title">Chúc mừng! Bạn đã hoàn thành khóa học!</div>
        <div class="cert-banner-sub">Tải chứng chỉ hoàn thành để lưu trữ và chia sẻ thành tích của bạn.</div>
      </div>
      <button class="btn btn-warning" id="btn-dl-cert" onclick="downloadCourseCert()">📥 Tải chứng chỉ</button>
    </div>
    <div id="lesson-panel">
      <div class="welcome-state">
        <div class="welcome-icon">🎓</div>
        <h3 style="font-size:1.2rem;font-weight:700;color:var(--text)">Chọn một bài học để bắt đầu</h3>
        <p>Chọn bài học từ danh sách bên trái.</p>
      </div>
    </div>
  </main>
</div>

<script src="js/api.js"></script>
<script>
if (!requireAuth('/login.html')) throw 0;
renderNavbar('my-courses');

const currentUser = getUser();
const params = new URLSearchParams(location.search);
const courseId = parseInt(params.get('courseId'));

if (!courseId) {
  document.body.innerHTML = '<div class="container section"><p style="color:var(--danger)">Thiếu tham số courseId.</p></div>';
  throw 0;
}

let isEnrolled = false;
let progressPercent = 0;
let currentLessonId = null;
let allSectionsData = [];
let quizSubmitted = false; // track per lesson-view session

// ── Update progress UI ──────────────────────────────────
function updateProgressUI(pct) {
  progressPercent = Math.round(pct ?? 0);
  const wrap = document.getElementById('progress-bar-wrap');
  const fill = document.getElementById('progress-fill');
  const label = document.getElementById('progress-pct');
  wrap.style.display = 'flex';
  fill.style.width = progressPercent + '%';
  label.textContent = progressPercent + '%';
  // Show cert banner
  const certBanner = document.getElementById('cert-banner');
  if (certBanner) certBanner.style.display = (progressPercent >= 100 && isEnrolled) ? 'flex' : 'none';
}

// ── Load sections + enrollment status ────────────────────
async function loadCourse() {
  showSpinner();
  const { ok, data } = await apiFetch(`/courses/${courseId}/sections`);
  hideSpinner();

  if (!ok) {
    document.getElementById('curriculum-list').innerHTML =
      `<div style="padding:20px;color:var(--danger)">${data.message || 'Không tải được nội dung.'}</div>`;
    return;
  }

  isEnrolled = data.data?.enrolled ?? false;
  const sections = data.data?.sections ?? data.data ?? [];
  allSectionsData = sections;

  // Update not-enrolled banner
  const banner = document.getElementById('not-enrolled-banner');
  const link   = document.getElementById('not-enrolled-link');
  if (!isEnrolled) {
    banner.style.display = 'flex';
    link.href = `/course.html?id=${courseId}`;
  }

  // Show progress bar only for enrolled students
  if (isEnrolled && currentUser?.role === 'student') {
    await refreshProgress();
  }

  // Render sidebar
  renderSidebar(sections);

  // Auto-select first accessible lesson
  const lessonIdParam = parseInt(params.get('lessonId')) || 0;
  let firstLesson = null;
  for (const sec of sections) {
    for (const lesson of (sec.lessons || [])) {
      if (!firstLesson && (isEnrolled || lesson.is_preview)) firstLesson = lesson;
      if (lessonIdParam && lesson.id === lessonIdParam) { selectLesson(lesson); return; }
    }
  }
  if (firstLesson) selectLesson(firstLesson);
}

async function refreshProgress() {
  const { ok, data } = await apiFetch(`/enrollments/${courseId}/progress`);
  if (ok && data.data) {
    updateProgressUI(data.data.progress_percent ?? 0);
  }
}

// ── Render sidebar ────────────────────────────────────────
function renderSidebar(sections) {
  if (!sections.length) {
    document.getElementById('curriculum-list').innerHTML =
      '<div style="padding:24px;text-align:center;color:var(--text-dim)">Khóa học chưa có bài học.</div>';
    return;
  }
  let html = '';
  sections.forEach(sec => {
    html += `<div class="section-group">
      <div class="section-title">
        <span>${sec.title}</span>
        <span style="font-size:.75rem;font-weight:400;color:var(--text-muted)">${(sec.lessons || []).length} bài</span>
      </div>
      <ul class="section-lessons">`;
    (sec.lessons || []).forEach(lesson => {
      const accessible = isEnrolled || lesson.is_preview;
      const isCompleted = lesson.progress?.is_completed ?? false;
      // Backend returns `type`, not `lesson_type`
      const lessonType = lesson.type || lesson.lesson_type || 'content';
      const icon = lessonType === 'video' ? '▶' :
                   lessonType === 'quiz'  ? '📝' : '📄';
      const lockedIcon = !accessible ? '🔒' : '';
      html += `<li class="lesson-row${!accessible ? ' locked' : ''}${isCompleted ? ' completed' : ''}" 
                   id="lr-${lesson.id}"
                   onclick="${accessible ? `selectLesson_byId(${lesson.id})` : ''}">
        <span class="lesson-icon">${lockedIcon || icon}</span>
        <span class="lesson-name">${lesson.title}</span>
        ${lesson.is_preview && !isEnrolled ? '<span class="preview-tag">Xem thử</span>' : ''}
        ${isCompleted ? '<span class="done-check">✓</span>' : ''}
      </li>`;
    });
    html += `</ul></div>`;
  });
  document.getElementById('curriculum-list').innerHTML = html;
}

function selectLesson_byId(id) {
  for (const sec of allSectionsData) {
    for (const lesson of (sec.lessons || [])) {
      if (lesson.id === id) { selectLesson(lesson); return; }
    }
  }
}

// ── Select & render lesson ────────────────────────────────
function selectLesson(lesson) {
  if (currentLessonId === lesson.id) return;
  currentLessonId = lesson.id;
  quizSubmitted = false;

  // Update sidebar active state
  document.querySelectorAll('.lesson-row').forEach(r => r.classList.remove('active'));
  const row = document.getElementById(`lr-${lesson.id}`);
  if (row) row.classList.add('active');

  // Update URL
  const u = new URL(location.href);
  u.searchParams.set('lessonId', lesson.id);
  history.replaceState({}, '', u);

  // Check accessible
  const accessible = isEnrolled || lesson.is_preview;
  if (!accessible) { renderLocked(lesson); return; }

  // Backend returns `type`, not `lesson_type`
  const type = lesson.type || lesson.lesson_type || 'content';
  if (type === 'video')        renderVideo(lesson);
  else if (type === 'quiz')    renderQuiz(lesson);
  else                         renderContent(lesson);
}

// ── Render: Locked ───────────────────────────────────────
function renderLocked(lesson) {
  document.getElementById('lesson-panel').innerHTML = `
    <div class="locked-lesson">
      <div class="lock-icon">🔒</div>
      <h3>${lesson.title}</h3>
      <p>Mua khóa học để mở khóa bài này và truy cập toàn bộ nội dung.</p>
      <a href="/course.html?id=${courseId}" class="btn btn-primary">Xem khóa học</a>
    </div>`;
}

// ── Render: Video ────────────────────────────────────────
function renderVideo(lesson) {
  const isCompleted = lesson.progress?.is_completed ?? false;
  let videoHtml = '';
  if (lesson.video_url) {
    const ytMatch = lesson.video_url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([^&\s]+)/);
    if (ytMatch) {
      videoHtml = `<iframe src="https://www.youtube.com/embed/${ytMatch[1]}" 
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
        allowfullscreen></iframe>`;
    } else {
      videoHtml = `<video controls id="lesson-video-el" src="${lesson.video_url}" style="width:100%;height:100%"></video>`;
    }
  } else {
    videoHtml = `<div class="lesson-video-placeholder">🎬</div>`;
  }

  const canQnA = isEnrolled && currentUser?.role === 'student';
  const isYoutube = lesson.video_url && /(?:youtube\.com\/watch\?v=|youtu\.be\/)/.test(lesson.video_url);
  const speedBarHtml = (!isYoutube && lesson.video_url) ? `
    <div class="video-speed-bar">
      <span class="video-speed-label">⚡ Tốc độ phát:</span>
      ${[0.5, 0.75, 1, 1.25, 1.5, 1.75, 2].map(s =>
        `<button class="speed-btn${s === 1 ? ' active' : ''}" onclick="setVideoSpeed(${s})">${s === 1 ? '1x (mặc định)' : s + 'x'}</button>`
      ).join('')}
    </div>` : '';

  document.getElementById('lesson-panel').innerHTML = `
    <div class="lesson-video-wrap">${videoHtml}</div>
    ${speedBarHtml}
    ${lessonHeaderHtml(lesson, 'video')}
    ${canQnA ? lessonTabsHtml(lesson.id) : ''}
    <div id="tab-content-panel" class="lesson-tab-panel active">
      <div class="complete-area" id="complete-area">
        ${completeOrDoneHtml(lesson.id, isCompleted)}
      </div>
    </div>
    <div id="tab-qna-panel" class="lesson-tab-panel">
      ${qnaSectionHtml()}
    </div>`;
  if (canQnA) loadQnA(lesson.id);
}

// ── Render: Content ──────────────────────────────────────
function renderContent(lesson) {
  const isCompleted = lesson.progress?.is_completed ?? false;
  const body = lesson.content_body || lesson.content || '';
  const canQnA = isEnrolled && currentUser?.role === 'student';
  document.getElementById('lesson-panel').innerHTML = `
    ${lessonHeaderHtml(lesson, 'content')}
    ${canQnA ? lessonTabsHtml(lesson.id) : ''}
    <div id="tab-content-panel" class="lesson-tab-panel active">
      <div class="content-body">${body || '<p style="color:var(--text-dim)">Bài học này chưa có nội dung.</p>'}</div>
      <div class="complete-area" id="complete-area">
        ${completeOrDoneHtml(lesson.id, isCompleted)}
      </div>
    </div>
    <div id="tab-qna-panel" class="lesson-tab-panel">
      ${qnaSectionHtml()}
    </div>`;
  if (canQnA) loadQnA(lesson.id);
}

// ── Render: Quiz ─────────────────────────────────────────
function renderQuiz(lesson) {
  const questions = lesson.questions || [];
  if (!questions.length) {
    document.getElementById('lesson-panel').innerHTML = `
      ${lessonHeaderHtml(lesson, 'quiz')}
      <p style="color:var(--text-dim)">Quiz này chưa có câu hỏi.</p>`;
    return;
  }

  let questionsHtml = questions.map((q, qi) => {
    const opts = q.options || q.answers || [];
    return `<div class="quiz-question-card" id="qq-${q.id}">
      <div class="quiz-question-text">${qi + 1}. ${q.question_text || q.content || q.question}</div>
      <div class="quiz-options">
        ${opts.map((opt, oi) => `
          <label class="quiz-option-label" id="opt-${q.id}-${oi}">
            <input type="radio" name="q-${q.id}" value="${oi}">
            <span>${opt.text || opt.content || opt}</span>
          </label>`).join('')}
      </div>
    </div>`;
  }).join('');

  const canQnA = isEnrolled && currentUser?.role === 'student';
  document.getElementById('lesson-panel').innerHTML = `
    ${lessonHeaderHtml(lesson, 'quiz')}
    ${canQnA ? lessonTabsHtml(lesson.id) : ''}
    <div id="tab-content-panel" class="lesson-tab-panel active">
      <div class="quiz-wrap" id="quiz-wrap">${questionsHtml}</div>
      <div class="quiz-submit-area" style="margin-top:20px">
        <button class="btn btn-warning" id="btn-submit-quiz" onclick="submitQuiz(${lesson.id})">
          📤 Nộp bài
        </button>
      </div>
      <div id="quiz-result" style="display:none;margin-top:20px"></div>
    </div>
    <div id="tab-qna-panel" class="lesson-tab-panel">
      ${qnaSectionHtml()}
    </div>`;
  if (canQnA) loadQnA(lesson.id);
}

async function submitQuiz(lessonId) {
  if (quizSubmitted) { showToast('Bạn đã nộp bài rồi.', 'info'); return; }

  // Collect answers
  const answers = [];
  const wrap = document.getElementById('quiz-wrap');
  const radios = wrap.querySelectorAll('input[type=radio]');
  const questionIds = new Set();
  radios.forEach(r => {
    const m = r.name.match(/^q-(\d+)$/);
    if (m) questionIds.add(parseInt(m[1]));
  });

  for (const qid of questionIds) {
    const checked = wrap.querySelector(`input[name="q-${qid}"]:checked`);
    answers.push({ question_id: qid, selected_index: checked ? parseInt(checked.value) : 0 });
  }

  const btn = document.getElementById('btn-submit-quiz');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner-sm"></span> Đang nộp...';
  showSpinner();

  const { ok, data } = await apiFetch(`/lessons/${lessonId}/submit-quiz`, {
    method: 'POST',
    body: JSON.stringify({ answers }),
  });
  hideSpinner();

  if (!ok) {
    showToast(data.message || 'Nộp bài thất bại', 'error');
    btn.disabled = false;
    btn.innerHTML = '📤 Nộp bài';
    return;
  }

  quizSubmitted = true;
  btn.innerHTML = '✅ Đã nộp';

  const result = data.data;
  // Backend returns: correct_count, total_questions, quiz_score (0-100), progress_percent
  const correctCount = result?.correct_count ?? result?.score ?? 0;
  const totalQ       = result?.total_questions ?? result?.total ?? answers.length;
  const quizScore    = result?.quiz_score ?? (totalQ > 0 ? Math.round((correctCount / totalQ) * 100) : 0);

  // Show result
  document.getElementById('quiz-result').style.display = 'block';
  document.getElementById('quiz-result').innerHTML = `
    <div class="quiz-result-box">
      <div class="quiz-score">${quizScore}%</div>
      <div class="quiz-score-label">Bạn trả lời đúng <strong>${correctCount}/${totalQ}</strong> câu</div>
      <p style="margin-top:12px;font-size:.85rem;color:var(--text-dim)">
        ${quizScore >= 80 ? '🎉 Xuất sắc! Bạn đã nắm vững bài học.' : quizScore >= 50 ? '👍 Khá tốt! Đã vượt qua bài quiz!' : '📚 Chưa đạt (50%). Hãy ôn lại và thử lại.'}
      </p>
      ${quizScore >= 50 ? '<p style="font-size:.82rem;color:var(--success)">✅ Bài học đã được đánh dấu hoàn thành!</p>' : '<button class="btn btn-warning btn-sm" style="margin-top:8px" onclick="location.reload()">🔄 Làm lại</button>'}
    </div>`;

  // Update progress from result directly (avoid extra API call)
  if (isEnrolled && result?.progress_percent !== undefined) {
    updateProgressUI(result.progress_percent);
    if (quizScore >= 50) markSidebarDone(lessonId);
  } else if (isEnrolled) {
    await refreshProgress();
    if (quizScore >= 50) markSidebarDone(lessonId);
  }
}

// ── Helpers ───────────────────────────────────────────────
function lessonHeaderHtml(lesson, type) {
  const typeLabel = type === 'video' ? '▶ Video' : type === 'quiz' ? '📝 Quiz' : '📄 Nội dung';
  const typeCls   = `type-${type}`;
  return `
    <div class="lesson-header">
      <span class="lesson-type-badge ${typeCls}">${typeLabel}</span>
      <h2>${lesson.title}</h2>
      ${lesson.description ? `<p>${lesson.description}</p>` : ''}
    </div>`;
}

function lessonTabsHtml(lessonId) {
  return `
    <div class="lesson-tabs">
      <button class="lesson-tab-btn active" id="tab-btn-content" onclick="switchLessonTab('content', ${lessonId})">📖 Nội dung</button>
      <button class="lesson-tab-btn" id="tab-btn-qna" onclick="switchLessonTab('qna', ${lessonId})">💬 Hỏi &amp; Đáp</button>
    </div>`;
}

function qnaSectionHtml() {
  return `
    <div class="qna-ask-form" id="qna-ask-form">
      <div class="qna-ask-form-title">🙋 Đặt câu hỏi về bài học</div>
      <div class="form-group">
        <input type="text" id="qna-title-input" class="form-control" placeholder="Tiêu đề câu hỏi..." maxlength="200">
      </div>
      <div class="form-group" style="margin-top:10px">
        <textarea id="qna-content-input" class="form-control" placeholder="Mô tả chi tiết câu hỏi của bạn..." style="min-height:90px"></textarea>
      </div>
      <button class="btn btn-primary btn-sm" id="btn-ask-question" onclick="submitAskQuestion()" style="margin-top:8px">📤 Gửi câu hỏi</button>
    </div>
    <div id="qna-list-container">
      <div class="empty-state" style="padding:24px 0"><div class="spinner-ring"></div></div>
    </div>
    <div id="qna-pagination" style="margin-top:16px"></div>`;
}

function switchLessonTab(tab, lessonId) {
  const contentPanel = document.getElementById('tab-content-panel');
  const qnaPanel     = document.getElementById('tab-qna-panel');
  const btnContent   = document.getElementById('tab-btn-content');
  const btnQnA       = document.getElementById('tab-btn-qna');
  if (!contentPanel || !qnaPanel) return;
  if (tab === 'content') {
    contentPanel.classList.add('active');
    qnaPanel.classList.remove('active');
    btnContent.classList.add('active');
    btnQnA.classList.remove('active');
  } else {
    qnaPanel.classList.add('active');
    contentPanel.classList.remove('active');
    btnQnA.classList.add('active');
    btnContent.classList.remove('active');
    if (!qnaPanel.dataset.loaded) loadQnA(lessonId);
  }
}

// ── Q&A State ─────────────────────────────────────────────
let qnaCurrentLessonId = null;
let qnaPage = 1;
let qnaTotalPages = 1;
let qnaOpenQuestionId = null;

function qnaTimeAgo(dateStr) {
  const diff = (Date.now() - new Date(dateStr).getTime()) / 1000;
  if (diff < 60) return 'vừa xong';
  if (diff < 3600) return `${Math.floor(diff/60)} phút trước`;
  if (diff < 86400) return `${Math.floor(diff/3600)} giờ trước`;
  return `${Math.floor(diff/86400)} ngày trước`;
}

function qnaEsc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function qnaAvatar(user, size = 32) {
  if (user?.avatar) {
    return `<div class="qna-q-avatar" style="width:${size}px;height:${size}px"><img src="${qnaEsc(user.avatar)}" alt="" onerror="this.parentElement.textContent='${(user.full_name||'?').charAt(0).toUpperCase()}'"></div>`;
  }
  return `<div class="qna-q-avatar" style="width:${size}px;height:${size}px">${(user?.full_name||'?').charAt(0).toUpperCase()}</div>`;
}

// ── Load Q&A list ─────────────────────────────────────────
async function loadQnA(lessonId, page = 1) {
  qnaCurrentLessonId = lessonId;
  qnaPage = page;
  const container = document.getElementById('qna-list-container');
  if (!container) return;

  const panel = document.getElementById('tab-qna-panel');
  if (panel) panel.dataset.loaded = '1';

  container.innerHTML = `<div class="empty-state" style="padding:24px 0"><div class="spinner-ring"></div></div>`;

  const { ok, data } = await apiFetch(`/lessons/${lessonId}/questions?page=${page}&limit=10`);
  if (!ok) {
    container.innerHTML = `<div class="empty-state"><div class="empty-icon">😕</div><p class="empty-text">Không thể tải câu hỏi.</p></div>`;
    return;
  }

  const questions = data.data?.questions ?? data.data ?? [];
  qnaTotalPages = data.data?.totalPages ?? 1;

  if (!questions.length) {
    container.innerHTML = `<div class="empty-state" style="padding:32px 0"><div class="empty-icon">📭</div><p class="empty-text">Chưa có câu hỏi nào. Hãy là người đầu tiên đặt câu hỏi!</p></div>`;
    renderQnAPagination(lessonId);
    return;
  }

  container.innerHTML = questions.map(q => {
    const resolved = q.is_resolved;
    const cnt = q.answers_count ?? 0;
    return `<div class="qna-question-card${resolved ? ' resolved' : ''}" onclick="openQnADetail(${q.id})">
      <div class="qna-q-header">
        ${qnaAvatar(q.user, 32)}
        <div class="qna-q-meta">
          <div class="qna-q-author">${qnaEsc(q.user?.full_name || '—')}</div>
          <div class="qna-q-time">${qnaTimeAgo(q.created_at)}</div>
        </div>
        ${resolved ? '<span class="badge badge-resolved">✅ Đã giải quyết</span>' : `<span class="badge badge-unresolved">💬 ${cnt} trả lời</span>`}
      </div>
      <div class="qna-q-title">${qnaEsc(q.title)}</div>
      <div class="qna-q-preview">${qnaEsc(q.content)}</div>
      <div class="qna-q-footer">
        ${currentUser && q.user?.id === currentUser.id ? `<button class="btn btn-sm btn-ghost" style="padding:2px 8px;font-size:.75rem" onclick="event.stopPropagation();deleteQuestion(${q.id})">🗑 Xóa</button>` : ''}
      </div>
    </div>`;
  }).join('');

  renderQnAPagination(lessonId);
}

function renderQnAPagination(lessonId) {
  const pag = document.getElementById('qna-pagination');
  if (!pag || qnaTotalPages <= 1) { if (pag) pag.innerHTML = ''; return; }
  pag.innerHTML = `
    <button class="btn btn-outline btn-sm" onclick="loadQnA(${lessonId}, ${qnaPage-1})" ${qnaPage===1?'disabled':''}>← Trước</button>
    <span class="page-info" style="font-size:.8rem">Trang ${qnaPage} / ${qnaTotalPages}</span>
    <button class="btn btn-outline btn-sm" onclick="loadQnA(${lessonId}, ${qnaPage+1})" ${qnaPage===qnaTotalPages?'disabled':''}>Sau →</button>`;
}

// ── Submit new question ───────────────────────────────────
async function submitAskQuestion() {
  const title   = document.getElementById('qna-title-input')?.value.trim();
  const content = document.getElementById('qna-content-input')?.value.trim();
  if (!title) { showToast('Vui lòng nhập tiêu đề câu hỏi', 'error'); return; }
  if (!content) { showToast('Vui lòng nhập nội dung câu hỏi', 'error'); return; }

  const btn = document.getElementById('btn-ask-question');
  btn.disabled = true; btn.innerHTML = '<span class="spinner-sm"></span> Đang gửi...';

  const { ok, data } = await apiFetch(`/lessons/${qnaCurrentLessonId}/questions`, {
    method: 'POST',
    body: JSON.stringify({ title, content }),
  });

  btn.disabled = false; btn.textContent = '📤 Gửi câu hỏi';
  if (!ok) { showToast(data.message || 'Gửi câu hỏi thất bại', 'error'); return; }

  showToast('Đã gửi câu hỏi ✅', 'success');
  document.getElementById('qna-title-input').value = '';
  document.getElementById('qna-content-input').value = '';
  loadQnA(qnaCurrentLessonId, 1);
}

// ── Delete question ───────────────────────────────────────
async function deleteQuestion(qId) {
  if (!confirm('Xóa câu hỏi này?')) return;
  const { ok, data } = await apiFetch(`/questions/${qId}`, { method: 'DELETE' });
  if (!ok) { showToast(data.message || 'Xóa thất bại', 'error'); return; }
  showToast('Đã xóa câu hỏi', 'success');
  loadQnA(qnaCurrentLessonId, qnaPage);
}

// ── Open Q&A detail modal ─────────────────────────────────
async function openQnADetail(questionId) {
  qnaOpenQuestionId = questionId;
  // Create modal if not exist
  let modal = document.getElementById('qna-detail-modal');
  if (!modal) {
    modal = document.createElement('div');
    modal.id = 'qna-detail-modal';
    modal.className = 'qna-detail-modal-overlay';
    modal.innerHTML = `
      <div class="qna-detail-box" id="qna-detail-inner">
        <div style="text-align:center;padding:24px"><div class="spinner-ring"></div></div>
      </div>`;
    modal.addEventListener('click', e => { if (e.target === modal) closeQnADetail(); });
    document.body.appendChild(modal);
    document.addEventListener('keydown', function escQnA(e) { if (e.key === 'Escape') closeQnADetail(); });
  } else {
    modal.classList.remove('hidden');
    document.getElementById('qna-detail-inner').innerHTML = `<div style="text-align:center;padding:24px"><div class="spinner-ring"></div></div>`;
  }

  const { ok, data } = await apiFetch(`/questions/${questionId}`);
  if (!ok) {
    document.getElementById('qna-detail-inner').innerHTML = `<p style="color:var(--danger);padding:24px">Không thể tải câu hỏi.</p>`;
    return;
  }

  renderQnADetail(data.data);
}

function renderQnADetail(q) {
  const isOwner  = currentUser && q.user?.id === currentUser.id;
  const answers  = q.answers || [];
  const canResolve = !q.is_resolved && isOwner;

  let answersHtml = `<div class="qna-answers-header">💬 ${answers.length} câu trả lời</div>`;
  if (!answers.length) {
    answersHtml += `<div class="empty-state" style="padding:16px 0"><p class="empty-text">Chưa có câu trả lời nào.</p></div>`;
  } else {
    answersHtml += answers.map(a => {
      const isInst = a.is_instructor_answer;
      const canDelA = currentUser && (a.user?.id === currentUser.id);
      return `<div class="qna-answer-card${isInst ? ' instructor-answer' : ''}">
        <div class="qna-answer-header">
          <div class="qna-answer-avatar">${a.user?.avatar ? `<img src="${qnaEsc(a.user.avatar)}" alt="">` : (a.user?.full_name||'?').charAt(0).toUpperCase()}</div>
          <div class="qna-answer-meta">
            <div class="qna-answer-author">${qnaEsc(a.user?.full_name || '—')} ${isInst ? '<span class="badge badge-instructor">⭐ Giảng viên</span>' : ''}</div>
            <div class="qna-answer-time">${qnaTimeAgo(a.created_at)}</div>
          </div>
          ${canDelA ? `<button class="btn btn-sm btn-ghost" style="padding:2px 8px;font-size:.75rem;color:var(--danger)" onclick="deleteAnswer(${a.id})">🗑</button>` : ''}
        </div>
        <div class="qna-answer-body">${qnaEsc(a.content || a.body || '')}</div>
      </div>`;
    }).join('');
  }

  const replyArea = `
    <div class="qna-reply-area">
      <div class="qna-reply-area-title">✏️ Viết câu trả lời</div>
      <textarea id="qna-reply-input" class="form-control" placeholder="Nhập câu trả lời..." style="min-height:80px"></textarea>
      <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-primary btn-sm" id="btn-submit-reply" onclick="submitQnAReply(${q.id})">📤 Gửi trả lời</button>
        ${canResolve ? `<button class="btn btn-success btn-sm" onclick="resolveQuestion(${q.id})">✅ Đánh dấu đã giải quyết</button>` : ''}
        <button class="btn btn-ghost btn-sm" onclick="closeQnADetail()">Đóng</button>
      </div>
    </div>`;

  document.getElementById('qna-detail-inner').innerHTML = `
    <div class="qna-detail-header">
      <div class="qna-detail-title">${qnaEsc(q.title)}</div>
      <button class="modal-close" onclick="closeQnADetail()">✕</button>
    </div>
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">
      ${qnaAvatar(q.user, 28)}
      <span style="font-size:.84rem;font-weight:600">${qnaEsc(q.user?.full_name||'—')}</span>
      <span style="font-size:.75rem;color:var(--text-muted)">${qnaTimeAgo(q.created_at)}</span>
      ${q.is_resolved ? '<span class="badge badge-resolved">✅ Đã giải quyết</span>' : ''}
    </div>
    <div class="qna-detail-body">${qnaEsc(q.content || q.body || '')}</div>
    ${answersHtml}
    ${replyArea}`;
}

function closeQnADetail() {
  const modal = document.getElementById('qna-detail-modal');
  if (modal) modal.classList.add('hidden');
  qnaOpenQuestionId = null;
}

async function submitQnAReply(questionId) {
  const content = document.getElementById('qna-reply-input')?.value.trim();
  if (!content) { showToast('Vui lòng nhập nội dung câu trả lời', 'error'); return; }

  const btn = document.getElementById('btn-submit-reply');
  btn.disabled = true; btn.innerHTML = '<span class="spinner-sm"></span> Đang gửi...';

  const { ok, data } = await apiFetch(`/questions/${questionId}/answers`, {
    method: 'POST',
    body: JSON.stringify({ content }),
  });

  btn.disabled = false; btn.textContent = '📤 Gửi trả lời';
  if (!ok) { showToast(data.message || 'Gửi thất bại', 'error'); return; }

  showToast('Đã gửi câu trả lời ✅', 'success');
  openQnADetail(questionId);
  loadQnA(qnaCurrentLessonId, qnaPage);
}

async function resolveQuestion(questionId) {
  const { ok, data } = await apiFetch(`/questions/${questionId}/resolve`, { method: 'PUT' });
  if (!ok) { showToast(data.message || 'Lỗi', 'error'); return; }
  showToast('Đã đánh dấu đã giải quyết ✅', 'success');
  openQnADetail(questionId);
  loadQnA(qnaCurrentLessonId, qnaPage);
}

async function deleteAnswer(answerId) {
  if (!confirm('Xóa câu trả lời này?')) return;
  const { ok, data } = await apiFetch(`/answers/${answerId}`, { method: 'DELETE' });
  if (!ok) { showToast(data.message || 'Xóa thất bại', 'error'); return; }
  showToast('Đã xóa câu trả lời', 'success');
  openQnADetail(qnaOpenQuestionId);
  loadQnA(qnaCurrentLessonId, qnaPage);
}


function completeOrDoneHtml(lessonId, isCompleted) {
  if (currentUser?.role !== 'student' || !isEnrolled) return '';
  if (isCompleted) {
    return `<span class="completed-badge">✔ Đã hoàn thành bài học</span>`;
  }
  return `<button class="btn btn-success" id="btn-complete-${lessonId}" onclick="markComplete(${lessonId})">
    ✅ Đánh dấu hoàn thành
  </button>`;
}

// ── Video Speed Control ───────────────────────────────────
function setVideoSpeed(speed) {
  const video = document.getElementById('lesson-video-el');
  if (video) video.playbackRate = speed;
  // Update active button
  document.querySelectorAll('.speed-btn').forEach(btn => {
    btn.classList.toggle('active', parseFloat(btn.textContent) === speed ||
      (speed === 1 && btn.textContent.startsWith('1x')));
  });
}

async function markComplete(lessonId) {
  const btn = document.getElementById(`btn-complete-${lessonId}`);
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spinner-sm"></span>'; }
  showSpinner();

  const { ok, data } = await apiFetch(`/lessons/${lessonId}/complete`, { method: 'POST' });
  hideSpinner();

  if (!ok) {
    showToast(data.message || 'Không thể đánh dấu hoàn thành', 'error');
    if (btn) { btn.disabled = false; btn.innerHTML = '✅ Đánh dấu hoàn thành'; }
    return;
  }

  // Update UI
  const area = document.getElementById('complete-area');
  if (area) area.innerHTML = `<span class="completed-badge">✔ Đã hoàn thành bài học</span>`;

  markSidebarDone(lessonId);

  const pct = data.data?.progress_percent ?? 0;
  updateProgressUI(pct);
  showToast(`✅ Đã hoàn thành! Tiến độ: ${Math.round(pct)}%`, 'success');
}

function markSidebarDone(lessonId) {
  const row = document.getElementById(`lr-${lessonId}`);
  if (row && !row.querySelector('.done-check')) {
    const check = document.createElement('span');
    check.className = 'done-check';
    check.textContent = '✓';
    row.appendChild(check);
    row.classList.add('completed');
  }
}

// ── Certificate download ──────────────────────────────────
async function downloadCourseCert() {
  const btn = document.getElementById('btn-dl-cert');
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spinner-sm"></span> Đang tạo...'; }
  try {
    const res = await fetch(`http://localhost:3000/api/courses/${courseId}/certificate`, {
      headers: getToken() ? { Authorization: `Bearer ${getToken()}` } : {},
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      showToast(err.message || 'Không thể tải chứng chỉ', 'error');
      return;
    }
    const blob = await res.blob();
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url; a.download = `certificate-course-${courseId}.pdf`;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1000);
    showToast('Đã tải chứng chỉ PDF! 🎓', 'success');
  } catch (_) {
    showToast('Lỗi khi tải chứng chỉ', 'error');
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = '📥 Tải chứng chỉ'; }
  }
}

// ── Init ──────────────────────────────────────────────────
loadCourse();
</script>
